<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gzforido neon cyber-tech profile banner</title>
  <desc id="desc">A dark cyan and violet developer banner with a GZ monogram.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070d" />
      <stop offset="0.48" stop-color="#0a0f18" />
      <stop offset="1" stop-color="#101326" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" />
      <stop offset="0.48" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#b06cff" />
    </linearGradient>
    <radialGradient id="cyan-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.26" />
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.42" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#7dd3fc" stroke-opacity="0.065" stroke-width="1" />
    </pattern>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 7.5 H 1200" stroke="#ffffff" stroke-opacity="0.018" />
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="318" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <rect width="1200" height="320" fill="url(#scanlines)" />
    <ellipse cx="230" cy="318" rx="355" ry="230" fill="url(#cyan-haze)" />
    <circle cx="1034" cy="112" r="260" fill="url(#violet-haze)" />

    <path d="M 0 66 H 38 L 55 49 H 350" fill="none" stroke="#00f0ff" stroke-opacity="0.34" stroke-width="1.5" />
    <path d="M 739 273 H 895 L 927 241 H 1200" fill="none" stroke="#a78bfa" stroke-opacity="0.36" stroke-width="1.5" />
    <path d="M 768 54 H 938 L 963 79 H 1200" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" />

    <g transform="translate(959 56)">
      <circle cx="96" cy="96" r="88" fill="#070b14" fill-opacity="0.76" stroke="#22d3ee" stroke-opacity="0.28" />
      <circle cx="96" cy="96" r="70" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="7 8" filter="url(#glow)" />
      <path d="M 96 10 L 170 53 L 170 139 L 96 182 L 22 139 L 22 53 Z" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.88" />
      <path d="M 96 30 L 153 63 L 153 129 L 96 162 L 39 129 L 39 63 Z" fill="#0b1020" fill-opacity="0.72" stroke="#8b5cf6" stroke-opacity="0.7" />
      <text x="96" y="115" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-3">GZ</text>
      <circle cx="96" cy="17" r="4" fill="#00f0ff" filter="url(#glow)" />
      <circle cx="170" cy="139" r="3.5" fill="#b06cff" filter="url(#glow)" />
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="70" y="55" fill="#7dd3fc" font-size="15" font-weight="600" letter-spacing="5">// DEVELOPER IDENTITY</text>

      <text x="66" y="163" fill="#00f0ff" fill-opacity="0.18" font-size="82" font-weight="900" letter-spacing="5">GZFORIDO</text>
      <text x="74" y="157" fill="#b06cff" fill-opacity="0.22" font-size="82" font-weight="900" letter-spacing="5">GZFORIDO</text>
      <text x="70" y="160" fill="#f8fafc" font-size="82" font-weight="900" letter-spacing="5">GZFORIDO</text>

      <rect x="72" y="179" width="635" height="4" rx="2" fill="url(#accent)" filter="url(#glow)" />
      <text x="72" y="218" fill="#cbd5e1" font-size="18" font-weight="500" letter-spacing="3.2">CODE / AUTOMATION / REVERSE ENGINEERING</text>

      <g transform="translate(72 244)" font-size="12" font-weight="600" letter-spacing="1.6">
        <rect width="103" height="31" rx="15.5" fill="#07151c" stroke="#00e5ff" stroke-opacity="0.52" />
        <text x="51.5" y="20" text-anchor="middle" fill="#67e8f9">LOW-LEVEL</text>

        <rect x="117" width="118" height="31" rx="15.5" fill="#0c1220" stroke="#38bdf8" stroke-opacity="0.5" />
        <text x="176" y="20" text-anchor="middle" fill="#7dd3fc">TELEGRAM</text>

        <rect x="249" width="139" height="31" rx="15.5" fill="#121020" stroke="#a78bfa" stroke-opacity="0.58" />
        <text x="318.5" y="20" text-anchor="middle" fill="#c4b5fd">GAME TOOLING</text>
      </g>

      <text x="1124" y="288" text-anchor="end" fill="#94a3b8" font-size="11" letter-spacing="2.2">BUILD // ANALYZE // EVOLVE</text>
    </g>

    <g transform="translate(34 111)" fill="url(#accent)">
      <rect width="4" height="84" opacity="0.95" />
      <rect x="8" y="14" width="2" height="56" opacity="0.55" />
      <rect x="14" y="27" width="2" height="30" opacity="0.3" />
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="22" fill="none" stroke="url(#accent)" stroke-opacity="0.56" stroke-width="2" />
</svg>
